<title>霓虹丑角 · 扑克肉鸽</title>
<style>
:root{--cw:90px;--jw:90px;--red:#ff4d5e;--blue:#18a0ff;--gold:#ffc23d;--green:#35d07f;--orange:#ff9a1f;--purple:#9b6bff;--panel:rgba(16,24,32,.86);--panel2:#25343f;--edge:#3d5262}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;color:#fff;font-family:"Zpix","Fusion Pixel 12px Proportional SC","Ark Pixel 12px Proportional zh_cn","Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC","Noto Sans SC","Hiragino Sans GB",monospace;font-weight:700;letter-spacing:.02em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
body.fast *{transition:none!important;animation:none!important}
#bg{position:fixed;left:0;top:0;image-rendering:pixelated;z-index:0;pointer-events:none}
#crt{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.10) 0,rgba(0,0,0,.10) 1px,rgba(0,0,0,0) 1px,rgba(0,0,0,0) 4px)}
#vig{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.45) 100%)}
body.nocrt #crt,body.nocrt #vig{display:none}
.lbl{font-size:12px;color:#b8c7d3;opacity:.9}
.blue-t{color:var(--blue)}.red-t{color:var(--red)}.gold-t{color:var(--gold)}.green-t{color:var(--green)}
.t,b,.btn,.bname,.hname{text-shadow:0 1px 0 rgba(0,0,0,.35)}
#app{position:fixed;top:var(--vtop,0px);right:0;bottom:auto;left:0;height:var(--vh,100dvh);z-index:1;display:grid;grid-template-columns:var(--sidew,250px) minmax(0,1fr);gap:10px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom));padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}
/* ------- side ------- */
#side{background:var(--panel);border:3px solid #10171d;border-radius:10px;box-shadow:0 6px 0 rgba(0,0,0,.45),inset 0 0 0 2px #2e3f4c;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:0;position:relative;overflow:hidden}
#side::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--bcol,#2f6fd6)}
.sb-blind{border-radius:8px;background:var(--bcol,#2f6fd6);padding:8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.sb-blind .bname{font-size:20px;text-align:center;padding:2px 0 6px}
.btarget{background:rgba(0,0,0,.35);border-radius:6px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tnum{font-size:24px;color:#ff6170;text-shadow:none}
.rew{font-size:13px;color:var(--gold)}
.sb-score{background:#0c1318;border-radius:8px;padding:8px;display:flex;align-items:center;justify-content:space-between;box-shadow:inset 0 0 0 2px #23323d}
.sb-score #sbScore{font-size:26px;text-shadow:none}
.sb-hand{background:#0c1318;border-radius:8px;padding:8px;box-shadow:inset 0 0 0 2px #23323d;position:relative}
.hname{font-size:20px;text-align:center;min-height:26px}
.hname small{font-size:13px;color:#b8c7d3}
.cm{display:flex;align-items:center;gap:6px;margin-top:6px;position:relative}
.chipbox,.multbox{flex:1;border-radius:6px;padding:8px 6px;font-size:26px;text-align:right;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25);transition:transform .08s;min-width:0;overflow:hidden;white-space:nowrap}
.chipbox{background:var(--blue)}.multbox{background:var(--red);text-align:left}
.xx{font-size:24px;color:var(--red)}
.bump{animation:bump .22s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18) rotate(-3deg)}100%{transform:scale(1)}}
.cm.fire::after{content:"";position:absolute;top:-10px;right:-6px;bottom:4px;left:-6px;border-radius:12px;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,rgba(255,140,30,.65),rgba(255,40,40,.25) 55%,transparent 72%);animation:fire .25s infinite alternate;mix-blend-mode:screen}
@keyframes fire{from{transform:scaleY(1);opacity:.8}to{transform:scaleY(1.12);opacity:1}}
.sb-bottom{display:flex;gap:8px;margin-top:auto}
.sb-btns{display:flex;flex-direction:column;gap:8px;width:72px}
.sb-btns .btn{flex:1}
.sb-stats{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.st{background:#0c1318;border-radius:6px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;box-shadow:inset 0 0 0 2px #23323d}
.st b{font-size:22px}
.st.wide{grid-column:span 2;justify-content:center}
.st.wide b{font-size:26px}
/* ------- buttons ------- */
.btn{white-space:nowrap;font:inherit;border:0;color:#fff;border-radius:8px;padding:10px 16px;font-size:17px;cursor:pointer;position:relative;background:#556;box-shadow:0 4px 0 rgba(0,0,0,.45);transition:transform .06s,filter .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.btn[disabled]{filter:grayscale(.85) brightness(.6);cursor:default;transform:none}
.btn.sm{padding:6px 8px;font-size:14px}
.btn.big{font-size:22px;padding:14px 20px}
.btn.blue{background:var(--blue)}.btn.red{background:var(--red)}.btn.orange{background:var(--orange)}.btn.green{background:#21a866}.btn.gold{background:#d9971a}.btn.purple{background:var(--purple)}.btn.gray{background:#4b5b66}
/* ------- main ------- */
#main{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
#top{display:flex;gap:10px;align-items:stretch}
.zone{background:rgba(0,0,0,.28);border-radius:10px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06);padding:6px;position:relative}
#jokerZone{flex:1}
.slotrow{position:relative;height:calc(var(--jw)*1.4);}
.cap{position:absolute;left:8px;bottom:-18px;font-size:12px;color:#b8c7d3}
#consZone .cap{left:auto;right:8px}
#mid{flex:1;position:relative;display:flex;flex-direction:column;min-height:0;margin-top:22px}
#playArea{flex:1;position:relative;min-height:calc(var(--cw)*1.55)}
#handLabel{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:22px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
#handLabel.show{opacity:1}
#handLabel small{color:#b8c7d3;font-size:15px}
#played{position:absolute;top:0;right:0;bottom:0;left:0}
#handArea{position:relative;z-index:25;height:calc(var(--cw)*1.4 + 34px)}
#hand{position:absolute;left:0;right:calc(var(--cw)*1.0 + 16px);top:18px;bottom:0}
#controls{display:flex;justify-content:center;align-items:center;gap:12px;padding:8px 0 2px;padding-right:calc(var(--cw)*1.0 + 16px);min-height:58px}
#controls .btn{min-width:110px}
.sortbox{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(0,0,0,.35);border-radius:8px;padding:4px 8px}
.sortbox span{font-size:11px;color:#b8c7d3}
.sortbox div{display:flex;gap:6px}
#deck{position:absolute;right:4px;bottom:6px;width:var(--cw);height:calc(var(--cw)*1.4);cursor:pointer;z-index:30}
#deck .dk{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:8%;background:repeating-linear-gradient(45deg,#c0392b 0 6px,#a12a1f 6px 12px);border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.5)}
#deck .dk::after{content:"";position:absolute;top:14%;right:14%;bottom:14%;left:14%;border:2px solid rgba(255,255,255,.7);border-radius:6%;background:radial-gradient(circle,#ffd54a 0 18%,transparent 20%)}
#deckCount{position:absolute;bottom:-18px;width:100%;text-align:center;font-size:13px}
/* panel */
#panel{position:absolute;top:0;right:0;bottom:0;left:0;display:none;z-index:20;border-radius:12px;background:rgba(8,14,20,.80);box-shadow:inset 0 0 0 3px #2e3f4c,0 8px 0 rgba(0,0,0,.35);overflow:auto;padding:12px;animation:slideUp .35s cubic-bezier(.2,.9,.25,1.15)}
#panel.show{display:block}
#panel.packmode{bottom:auto;height:calc(100% - var(--cw)*1.4 - 96px);min-height:calc(var(--cw)*1.4 + 70px)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
/* ------- cards ------- */
.card{position:absolute;top:0;width:var(--cw);height:calc(var(--cw)*1.4);transition:left .28s cubic-bezier(.2,.8,.2,1),top .28s,transform .28s cubic-bezier(.2,.8,.2,1);cursor:pointer;font-size:calc(var(--cw)*.2)}
.cin{position:absolute;top:0;right:0;bottom:0;left:0;transition:transform .14s cubic-bezier(.3,1.6,.5,1)}
.card.sel .cin{transform:translateY(calc(-1px * var(--lift,30)))}
@media (hover:hover){.card:hover .cin{transform:translateY(-8px)}.card.sel:hover .cin{transform:translateY(calc(-1px * var(--lift,30) - 4px))}}
.face{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:7%;background:#f5efe2;border:2px solid #fff;box-shadow:0 .25em 0 rgba(0,0,0,.45),inset 0 0 0 .14em rgba(0,0,0,.06);overflow:hidden;animation:idle 3.2s ease-in-out infinite;animation-delay:var(--dl,0s)}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.crn{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.95;font-size:1.15em;width:1.25em}
.crn svg{width:calc(7px*var(--cpx,2));height:calc(8px*var(--cpx,2));margin-top:.1em}
.crn.tl{left:.18em;top:.22em}.crn.br{right:.18em;bottom:.22em;transform:rotate(180deg)}
.pip{position:absolute;width:calc(7px*var(--ppx,2));height:calc(8px*var(--ppx,2));transform:translate(-50%,-50%)}
.pip.f{transform:translate(-50%,-50%) rotate(180deg)}
.pip svg,.bigpip svg,.faceart svg,.jart svg,.tart svg{width:100%;height:100%;display:block}
.bigpip{position:absolute;left:50%;top:50%;width:calc(7px*var(--bpx,4));height:calc(8px*var(--bpx,4));transform:translate(-50%,-50%)}
.faceart{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:calc(9px*var(--fpx,5) + 8px);height:calc(12px*var(--fpx,5) + 8px);border-radius:4px;background:rgba(0,0,0,.06);box-shadow:inset 0 0 0 2px currentColor;padding:4px}
.card.enh-bonus .face{background:#dbe9ff;border-color:#8cc0ff}
.card.enh-mult .face{background:#ffe1dc;border-color:#ff8a80}
.card.enh-glass .face{background:linear-gradient(135deg,rgba(210,245,255,.92),rgba(160,215,240,.8) 50%,rgba(225,250,255,.95));border-color:#e6fbff}
.card.enh-glass .face::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.75) 40%,transparent 48%);animation:shine 2.6s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.card.enh-steel .face{background:linear-gradient(160deg,#cfd6dc,#9aa7b1 50%,#d9e0e5);border-color:#eef}
.card.enh-gold .face{background:linear-gradient(160deg,#ffe58a,#e7b53c 55%,#fff0b0);border-color:#fff4c4}
.etag{position:absolute;left:50%;bottom:.15em;transform:translateX(-50%);font-size:.55em;padding:.05em .35em;border-radius:.3em;color:#fff;white-space:nowrap}
.enh-bonus .etag{background:var(--blue)}.enh-mult .etag{background:var(--red)}.enh-glass .etag{background:#4fb6d8}.enh-steel .etag{background:#5f6c76}.enh-gold .etag{background:#c08a10}
.card.debuff .face{filter:grayscale(.9) brightness(.7)}
.card.debuff .face::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(45deg,transparent 46%,rgba(220,40,40,.85) 46% 54%,transparent 54%);z-index:3}
.card.nonscore .cin{opacity:.55;transform:translateY(12%) scale(.94)}
.card.scoring .cin{transform:translateY(-10%)}
.card.flip .face{animation:flipc .4s}
@keyframes flipc{0%{transform:scaleX(1)}50%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.card.small{position:relative;display:inline-block;margin:2px}
.shk{animation:shk .28s}
@keyframes shk{0%{transform:rotate(0) scale(1)}25%{transform:rotate(-7deg) scale(1.16)}55%{transform:rotate(6deg) scale(1.12)}100%{transform:rotate(0) scale(1)}}
/* jokers & consumables */
.jk{position:absolute;top:0;width:var(--jw);height:calc(var(--jw)*1.4);font-size:calc(var(--jw)*.13);transition:left .25s cubic-bezier(.2,.8,.2,1);cursor:grab;touch-action:none}
.jk .jin{position:absolute;top:0;right:0;bottom:0;left:0;border-radius:8%;border:2px solid #fff;box-shadow:0 .35em 0 rgba(0,0,0,.45);overflow:hidden;animation:idle 3.6s ease-in-out infinite;animation-delay:var(--dl,0s)}
.jk.drag{z-index:50;transition:none;cursor:grabbing}
.jk.drag .jin{transform:scale(1.08) rotate(-3deg);box-shadow:0 1em 1.2em rgba(0,0,0,.5)}
.jk.rar-c .jin{background:linear-gradient(170deg,#3e6fb0,#24446e)}
.jk.rar-u .jin{background:linear-gradient(170deg,#2f9a6a,#185a3e)}
.jk.rar-r .jin{background:linear-gradient(170deg,#c8434f,#7a1f2a)}
.jk.rar-l .jin{background:linear-gradient(170deg,#a05ae0,#4b2280);box-shadow:0 .35em 0 rgba(0,0,0,.45),0 0 1em rgba(200,140,255,.7)}
.jk.tarot .jin{background:linear-gradient(170deg,#8a5bd6,#41286e)}
.jk.planet .jin{background:linear-gradient(170deg,#24315e,#0d1430)}
.jk.packc .jin{background:linear-gradient(170deg,#d9971a,#7d4f06)}
.jart{position:absolute;left:12%;top:8%;width:76%;height:54%;background:rgba(0,0,0,.25);border-radius:6%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.jart svg{width:calc(12px*var(--jpx,5))!important;height:calc(12px*var(--jpx,5))!important;flex:none}
.jname{position:absolute;left:2%;right:2%;bottom:6%;text-align:center;font-size:max(8px,min(1.05em,calc(var(--jw)*.215)));white-space:nowrap;overflow:hidden;line-height:1.15;text-shadow:none}
.jbadge{position:absolute;right:4%;top:3%;font-size:.85em;background:rgba(0,0,0,.55);padding:0 .3em;border-radius:.3em}
.planetorb{position:absolute;left:24%;top:12%;width:52%;aspect-ratio:1;border-radius:50%;box-shadow:inset -.6em -.4em 0 rgba(0,0,0,.35),0 0 .9em rgba(160,200,255,.5)}
.planetorb::after{content:"";position:absolute;left:-30%;right:-30%;top:44%;height:14%;border-radius:50%;border:.18em solid rgba(255,230,170,.75);transform:rotate(-14deg)}
.stars{position:absolute;top:0;right:0;bottom:0;left:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 15%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1px 1px at 10% 75%,#fff,transparent),radial-gradient(1px 1px at 50% 85%,#fff,transparent)}
.jk.sel-pulse .jin{outline:3px solid var(--gold)}
/* popups */
#fx{position:fixed;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:800}
.pop{position:fixed;transform:translate(-50%,-100%);font-size:22px;padding:2px 8px;border-radius:6px;white-space:nowrap;animation:popup .85s cubic-bezier(.2,.9,.3,1.3) forwards;text-shadow:none;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.pop.pc{background:var(--blue)}.pop.pm{background:var(--red)}.pop.px{background:#fff;color:var(--red);text-shadow:none;font-size:26px}.pop.py{background:#d9971a}.pop.pg{background:#555}.pop.pw{background:#ffcf3d;color:#2b1a00;text-shadow:none}
@keyframes popup{0%{transform:translate(-50%,-60%) scale(.3);opacity:0}18%{transform:translate(-50%,-125%) scale(1.25);opacity:1}35%{transform:translate(-50%,-120%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-160%) scale(.9);opacity:0}}
.bigscore{position:fixed;transform:translate(-50%,-50%);font-size:54px;color:#fff;text-shadow:0 3px 0 #000;animation:bigs 1.1s forwards;z-index:810}
@keyframes bigs{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}20%{transform:translate(-50%,-50%) scale(1.25);opacity:1}35%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-90%) scale(.9);opacity:0}}
.shake{animation:scrsh .3s}
@keyframes scrsh{0%,100%{transform:none}20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.spark{position:fixed;width:6px;height:6px;background:#ffd54a;z-index:805;pointer-events:none}
/* tooltip & popover */
#tip,#pop{position:fixed;z-index:880;max-width:260px;background:#f4efe4;color:#1a1f24;border-radius:10px;padding:10px 12px;box-shadow:0 6px 0 rgba(0,0,0,.45),0 0 0 3px #1a1f24;font-size:14px;line-height:1.45;pointer-events:none;display:none;text-shadow:none}
#pop{pointer-events:auto;z-index:890}
#tip h4,#pop h4{margin:0 0 4px;font-size:17px}
.rtag{display:inline-block;font-size:11px;color:#fff;border-radius:4px;padding:0 6px;margin-bottom:4px}
.rt-c{background:#3e6fb0}.rt-u{background:#21a866}.rt-r{background:#d83a4c}.rt-l{background:#9b5be0}.rt-t{background:#7a4fc4}.rt-p{background:#2c3f7a}.rt-k{background:#c47d10}
.dsc .c{color:#0a7ad1}.dsc .m{color:#e0263a}.dsc .x{background:#e0263a;color:#fff;border-radius:3px;padding:0 3px}.dsc .g{color:#b37400}.dsc .h{color:#e0393e}.dsc .s{color:#2b3d66}.dsc .cl{color:#1f7a5a}.dsc .d{color:#e8841a}
.popbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.popbtns .btn{font-size:14px;padding:7px 10px}
/* overlays */
#ov{position:fixed;top:0;right:0;bottom:0;left:0;z-index:850;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:14px}
#ov{top:var(--vtop,0px);bottom:auto;height:var(--vh,100dvh);padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
#ov.show{display:flex}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 0 0 3px #0b1116,inset 0 0 0 3px #2e3f4c,0 10px 0 rgba(0,0,0,.4);padding:18px;max-width:760px;width:100%;max-height:100%;overflow:auto;animation:slideUp .3s cubic-bezier(.2,.9,.25,1.15)}
.modal h2{margin:0 0 12px;text-align:center;font-size:28px}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.menu{display:flex;flex-direction:column;align-items:center;gap:12px}
.menu .btn{min-width:220px}
.logo{font-size:min(15vw,92px);line-height:1;letter-spacing:.06em;color:#fff;text-shadow:0 4px 0 #a51f4a,0 8px 0 #000;text-align:center;margin:10px 0 0;animation:logo 2.4s ease-in-out infinite}
.logo span{display:inline-block;animation:lbob 1.8s ease-in-out infinite}
@keyframes lbob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes logo{0%,100%{filter:none}50%{filter:hue-rotate(25deg) brightness(1.1)}}
.sub{color:#9fe8ff;text-align:center;letter-spacing:.2em;font-size:15px}
.menucards{--ppx:1;--cpx:1;--bpx:4;--fpx:4;position:relative;height:120px;width:300px;margin:6px auto;--cw:70px}
.help{font-size:15px;line-height:1.65;color:#e5edf2}
.help h3{color:var(--gold);margin:14px 0 4px}
.help table{border-collapse:collapse;width:100%;font-size:14px}
.help td,.help th{border-bottom:1px solid #2e3f4c;padding:4px 6px;text-align:left}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:20px;background:#0c1318;padding:10px 14px;border-radius:8px;min-width:260px}
.statsgrid{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:16px;background:#0c1318;padding:12px 16px;border-radius:10px}

<script>
'use strict';
/* ================= 基础工具 ================= */
const $=s=>document.querySelector(s);

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const QS=new URLSearchParams(location.search);
const SET=Object.assign({sfx:true,music:true,speed:1,crt:true},JSON.parse(localStorage.getItem('nj_set')||'{}'));
if(QS.has('fast')){SET.speed=40;const oa=Element.prototype.animate;Element.prototype.animate=function(k,o){o=typeof o==='object'?Object.assign({},o,{duration:1,delay:0}):1;return oa.call(this,k,o)}}
const saveSet=()=>localStorage.setItem('nj_set',JSON.stringify(Object.assign({},SET,QS.has('fast')?{speed:1}:{})));
class RunCancelled extends Error {}

 const wasPaused=pauseReasons.size>0;if(on)pauseReasons.add(reason);else pauseReasons.delete(reason);if(!wasPaused&&pauseReasons.size)pauseStarted=performance.now();else if(wasPaused&&!pauseReasons.size)pauseElapsed+=performance.now()-pauseStarted;
 document.body.classList.toggle('game-paused',pauseReasons.size>0);
 if(pauseReasons.size){for(const a of document.getAnimations()){if(a.effect&&a.effect.target&&a.effect.target.closest('#app,#fx')&&a.playState==='running'){a.pause();heldAnimations.push(a)}}}
 else{for(const a of heldAnimations){try{if(a.playState==='paused')a.play()}catch(e){}}heldAnimations=[]}
}

function sleep(ms){const epoch=runEpoch;let remaining=ms/SET.speed,last=activeNow();return new Promise((resolve,reject)=>{const tick=()=>{if(epoch!==runEpoch){reject(new RunCancelled());return}const now=activeNow();remaining-=now-last;last=now;if(remaining<=0){resolve();return}setTimeout(tick,16)};setTimeout(tick,0)})}
function guarded(fn){return async function(...args){try{return await fn.apply(this,args)}catch(e){if(e instanceof RunCancelled)return;console.error(e);busy=false;toast('操作意外中断，请重新载入稳定存档');}}}
function fmt(n){n=Math.floor(n);if(!isFinite(n))return '∞';if(Math.abs(n)<1e11)return n.toLocaleString('en-US');return n.toExponential(3).replace('e+','e')}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ================= 牌与牌型 ================= */
const SUITS=['S','H','C','D'];
const SUITN={S:'黑桃',H:'红心',C:'梅花',D:'方块'};
const SUITC={S:'#283a63',H:'#df3a3f',C:'#1d7a59',D:'#e57f12'};
const RL=r=>r<=10?''+r:{11:'J',12:'Q',13:'K',14:'A'}[r];
const chipsOf=c=>c.r<=10?c.r:(c.r<14?10:11);
const isFace=c=>c.r>=11&&c.r<=13;
const HANDS={
 HC:{n:'高牌',c:5,m:1,lc:10,lm:1},PR:{n:'对子',c:10,m:2,lc:15,lm:1},TP:{n:'两对',c:20,m:2,lc:20,lm:1},
 '3K':{n:'三条',c:30,m:3,lc:20,lm:2},ST:{n:'顺子',c:30,m:4,lc:30,lm:3},FL:{n:'同花',c:35,m:4,lc:15,lm:2},
 FH:{n:'葫芦',c:40,m:4,lc:25,lm:2},'4K':{n:'四条',c:60,m:7,lc:30,lm:3},SF:{n:'同花顺',c:100,m:8,lc:40,lm:4}};
const HAND_ORDER=['SF','4K','FH','FL','ST','3K','TP','PR','HC'];
const has={pair:t=>['PR','TP','3K','FH','4K'].includes(t),three:t=>['3K','FH','4K'].includes(t),str:t=>['ST','SF'].includes(t),fl:t=>['FL','SF'].includes(t),two:t=>['TP','FH'].includes(t)};
function evalHand(cards){
  const n=cards.length;if(!n)return null;
  const byR={};cards.forEach(c=>(byR[c.r]=byR[c.r]||[]).push(c));
  const g=Object.values(byR).sort((a,b)=>b.length-a.length||b[0].r-a[0].r);
  const flush=n===5&&cards.every(c=>c.s===cards[0].s);
  let straight=false;
  if(n===5&&g.length===5){const rs=cards.map(c=>c.r).sort((a,b)=>a-b);straight=rs[4]-rs[0]===4||rs.join()==='2,3,4,5,14'}
  let type,sc;
  if(straight&&flush){type='SF';sc=cards}
  else if(g[0].length>=4){type='4K';sc=g[0].slice(0,4)}
  else if(g[0].length===3&&g[1]&&g[1].length===2){type='FH';sc=cards}
  else if(flush){type='FL';sc=cards}
  else if(straight){type='ST';sc=cards}
  else if(g[0].length===3){type='3K';sc=g[0]}
  else if(g[0].length===2&&g[1]&&g[1].length===2){type='TP';sc=g[0].concat(g[1])}
  else if(g[0].length===2){type='PR';sc=g[0]}
  else{type='HC';sc=[cards.reduce((a,b)=>b.r>a.r?b:a)]}
  const set=new Set(sc);
  return {type,scoring:cards.filter(c=>set.has(c))};
}

/* ================= 文本标记 ================= */
const C_=t=>`<span class="c">${t}</span>`, M_=t=>`<span class="m">${t}</span>`, X_=t=>`<span class="x">${t}</span>`, G_=t=>`<span class="g">${t}</span>`;

 mask:{n:'面具丑角',r:'c',cost:2,d:()=>`倍率 ${M_('+4')}`,main:()=>({mult:4})},

function pix(rows,pal){
  const h=rows.length,w=rows[0].length,by={};
  rows.forEach((row,y)=>{for(let x=0;x<w;x++){const ch=row[x];const col=pal[ch];if(!col)continue;(by[col]=by[col]||[]).push(`M${x} ${y}h1v1h-1z`)}});
  let s=`<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">`;
  for(const c in by)s+=`<path fill="${c}" d="${by[c].join('')}"/>`;
  return s+'</svg>';
}

  AU.timer=setInterval(()=>{const c=AU.ctx;if(!c||!AU.gestureReady||c.state!=='running'||document.hidden)return;while(AU.next<c.currentTime+.3){const st=AU.step,bar=Math.floor(st/8)%4,ch=PROG[bar],k=st%8;const t=AU.next-c.currentTime;
    if(k===0||k===4)tone(mtf(ch[0]-12),.45,'triangle',.5,null,t,AU.mus);

async function resumeAudio(explicit){
 const c=AU.ctx;if(!c)return false;
 if(explicit&&'audioSession' in navigator){try{navigator.audioSession.type='playback'}catch(e){}}

  if(c.state!=='running'){let timer;try{await Promise.race([c.resume(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('resume timeout')),1800)})])}finally{clearTimeout(timer)}}
  if(c.state!=='running'){updateSoundStatus('声音暂不可用，请点击“测试声音”重试');return false}
  AU.next=c.currentTime+.08;updateSoundStatus('音频已就绪；听不到请检查系统音量及输出设备');return true;
 }catch(e){updateSoundStatus('浏览器未恢复声音，请再次点击测试声音');return false}})();
 audioResumePending=task;try{return await task}finally{if(audioResumePending===task)audioResumePending=null}
}

function computeScore(playedIds,heldIds){
  const played=playedIds.map(cardById);heldIds=heldIds||S.hand.filter(id=>!playedIds.includes(id));
  const ev=evalHand(played);const boss=activeBoss();const lv=handVal(ev.type);
  let chips=lv.c,mult=lv.m;
  if(boss&&S.boss==='half'){chips=Math.ceil(chips/2);mult=Math.max(1,Math.ceil(mult/2))}
  const steps=[{k:'base',chips,mult}];
  if(boss&&S.boss==='eye'&&S.typesThisRound.includes(ev.type))return {type:ev.type,scoring:ev.scoring,played,chips:0,mult:0,total:0,steps:[{k:'base',chips:0,mult:0},{k:'msg',text:'牌型重复！'}],dead:true};
  const ctx={type:ev.type,played,scoring:ev.scoring,held:heldIds.map(cardById)};
  const apply=(e,tgt)=>{if(!e)return;
    if(e.chips){chips+=e.chips;steps.push({k:'chips',v:e.chips,tgt,chips,mult})}
    if(e.mult){mult+=e.mult;steps.push({k:'mult',v:e.mult,tgt,chips,mult})}
    if(e.xmult&&e.xmult!==1){mult*=e.xmult;steps.push({k:'xmult',v:e.xmult,tgt,chips,mult})}};
  const glass=[];
  for(const c of ctx.scoring){const tgt={t:'card',id:c.id};
    if(isDebuffed(c)){steps.push({k:'debuff',tgt});continue}
    let reps=1;S.jokers.forEach((j,i)=>{const n=jHook(i,'retrig',ctx,c);if(n)reps+=n});
    for(let r=0;r<reps;r++){
      if(r>0)steps.push({k:'again',tgt});
      apply({chips:chipsOf(c)},tgt);
      if(c.enh==='bonus')apply({chips:30},tgt);
      if(c.enh==='mult')apply({mult:4},tgt);
      if(c.enh==='glass')apply({xmult:2},tgt);
      S.jokers.forEach((j,i)=>{const e=jHook(i,'card',ctx,c);if(e)apply(e,{t:'joker',uid:j.uid,at:c.id})});
    }
    if(c.enh==='glass')glass.push(c.id);
  }
  for(const c of ctx.held){if(isDebuffed(c))continue;const tgt={t:'held',id:c.id};
    if(c.enh==='steel')apply({xmult:1.5},tgt);
    S.jokers.forEach((j,i)=>{const e=jHook(i,'held',ctx,c);if(e)apply(e,{t:'joker',uid:j.uid,at:c.id})});
  }
  S.jokers.forEach((j,i)=>{const e=jHook(i,'main',ctx);if(e)apply(e,{t:'joker',uid:j.uid})});
  return {type:ev.type,scoring:ev.scoring,played,chips,mult,total:Math.floor(chips*mult),steps,glass};
}

 const item=x=>{if(!x||!num(x.cost,0,100)||x.sold!==undefined&&typeof x.sold!=='boolean')fail();let y;if(x.type==='pack')y={type:'pack',p:packdef(x.p)};else if(x.type==='joker'){if(!own(JK,x.key))fail();y={type:'joker',key:x.key}}else y=consumable(x);return{...y,cost:x.cost,sold:!!x.sold}};
 let shop=null;if(s.shop!==null){if(!s.shop||!arr(s.shop.items,2)||!arr(s.shop.packs,2)||!num(s.shop.reroll,5,1e6))fail();shop={items:s.shop.items.map(item),packs:s.shop.packs.map(item),reroll:s.shop.reroll};if(shop.packs.some(x=>x.type!=='pack'))fail()}
 let pack=null;if(s.pack!==null){const p=s.pack;if(!p||!arr(p.choices,5)||!['blind','shop'].includes(p.ret))fail();const pd=packdef(p.p);const choices=p.choices.map(x=>x?.type==='joker'&&own(JK,x.key)?{type:'joker',key:x.key}:consumable(x));if(choices.some(x=>x.type!==pd.t)||choices.length!==pd.size)fail();pack={p:pd,choices,hand:pd.t==='tarot'?idlist(p.hand,8):null,ret:p.ret}}
 let cash=null;if(s.cash!==null){if(!s.cash||!arr(s.cash.rows,20)||!num(s.cash.total))fail();const rows=s.cash.rows.map(r=>{if(!r||typeof r.l!=='string'||r.l.length>100||!num(r.v))fail();return{l:r.l,v:r.v}});if(rows.reduce((n,r)=>n+r.v,0)!==s.cash.total)fail();cash={rows,total:s.cash.total}}
 if(s.phase==='shop'&&!shop||s.phase==='pack'&&!pack||s.phase==='cashout'&&!cash||s.phase==='round'&&hand.length===0)fail();
 return{v:1,nextId:s.nextId,uid:s.uid,ante:s.ante,blind:s.blind,round:s.round,money:s.money,hands:s.hands,discards:s.discards,baseHands:4,baseDisc:3,baseHandSize:8,handSize:s.handSize,jokerSlots:5,consSlots:2,deck,draw,hand,jokers,cons,score:s.score,levels,phase:s.phase,blindState:s.blindState.slice(),boss:s.boss,usedBoss:s.usedBoss.slice(),tags:s.tags.slice(),typesThisRound:s.typesThisRound.slice(),shop,pack,freeRerolls:s.freeRerolls,sortMode:s.sortMode,endless:s.endless,invest:s.invest,cash,stats};
}
async function importSaveFile(file){try{if(!file||file.size>1000000)throw new Error('存档文件过大或未选择文件');const parsed=JSON.parse(await file.text());const clean=validateSave(parsed);if(!confirm('导入将替换当前牌局。建议先导出当前存档。继续吗？'))return;resetRuntime();localStorage.setItem('nj_save',JSON.stringify(clean));loadGame();closeModal();toast('存档已导入')}catch(e){setFileStatus(e instanceof SyntaxError?'文件不是有效 JSON 存档':e.message)}}
function saveFilesMenu(){modal(`<h2>存档备份</h2><div class="help"><p>Safari 和主屏幕版存档可能独立。先在原入口导出，再在新入口导入。只保存本机，没有云端账户。</p><p>动画尚未完成时导出的是上一个完整存档点，刷新/退出同样回到该点，不会保存半次出牌。</p><div class="row"><button class="btn blue" data-act="export">导出存档</button><label class="btn green" for="saveInput">选择存档文件<input id="saveInput" type="file" accept="application/json,.json" hidden></label></div><p id="fileStatus" role="status"></p></div><div class="row"><button class="btn red" data-act="${S?'pause':'menu'}">返回</button></div>`);$('#saveInput').onchange=e=>importSaveFile(e.target.files[0]);}

function helpHTML(){return `<h2>玩法说明</h2><div class="help">
<h3>目标</h3>用扑克牌型拿分，在每个盲注里达到<b class="red-t">目标分数</b>。每个底注有 小盲注 → 大盲注 → 首领盲注，打败第 8 底注的首领即通关，之后可继续无尽模式。
<h3>回合</h3>手牌 8 张。每次最多选 5 张：<b class="blue-t">出牌</b>（每回合 4 次）计分，或<b class="red-t">弃牌</b>（每回合 3 次）换新牌。出牌用完仍未达标就失败。
<h3>计分 = 筹码 × 倍率</h3>牌型给基础筹码和倍率；参与计分的每张牌再加上点数筹码（2~10 按点数，J/Q/K 为 10，A 为 11）。然后小丑从<b>左到右</b>依次结算：+筹码、+倍率、×倍率。顺序很重要，先加后乘更划算。
<table><tr><th>牌型</th><th>筹码 × 倍率</th><th>牌型</th><th>筹码 × 倍率</th></tr>
${[['SF','4K'],['FH','FL'],['ST','3K'],['TP','PR'],['HC',null]].map(r=>`<tr>${r.map(k=>k?`<td>${HANDS[k].n}</td><td><span class="blue-t">${HANDS[k].c}</span> × <span class="red-t">${HANDS[k].m}</span></td>`:'<td></td><td></td>').join('')}</tr>`).join('')}</table>
<p>复制出现五张同点数时，保守按其中四张作“四条”计分，沿用四条升级；不会退化为高牌。</p><h3>经济</h3>过关得盲注奖励（$3/$4/$5）+ 每剩余一次出牌 $1 + 利息（每持有 $5 得 $1，最多 $5）。小盲/大盲可以<b>跳过</b>，换取一个奖励标签。
<h3>商店</h3>可买小丑（最多 5 个）、秘仪牌、星图牌（消耗槽 2 个）和卡包。刷新从 $5 起每次 +$1。小丑可出售，可拖动或用 ◀ ▶ 调整顺序。
<h3>消耗牌</h3><b>秘仪牌</b>：改花色、升点数、复制、摧毁、强化牌、给金币等，需在回合中先选中手牌再使用。<b>星图牌</b>：提升对应牌型等级。
<h3>强化牌</h3>奖励（+30 筹码）、倍率（+4 倍率）、琉璃（×2 倍率，可能碎）、钢铁（留在手中 ×1.5）、黄金（留在手中回合结束 +$3）。
<h3>首领</h3>每个首领有特殊限制，例如某花色失效、手牌 -1、不能弃牌、只能出一次、目标翻倍等。选择前可在盲注卡上看到。
<h3>操作</h3>点击/轻触牌选中；点击小丑或消耗牌查看并操作；拖动小丑换位置；右下角牌堆查看牌组和牌型等级。电脑上鼠标悬停可看说明。
</div><div class="row"><button class="btn red" data-act="${menuOpen?'menu':'closeov'}">返回</button></div>`}
let menuOpen=false;

function showPause(){if(!S)return;modal(`<h2>暂停</h2><p class="savehint">计分已暂停。动画未完成时退出或刷新，将回到上一个完整存档点。</p><div class="menu"><button class="btn blue big" data-act="closeov">继续</button><button class="btn red" data-act="helpP">玩法说明</button><button class="btn gray" data-act="settingsP">设置 / 测试声音</button><button class="btn gray" data-act="devicehelp">手机独立打开</button><button class="btn gray" data-act="savefiles">存档导出 / 导入</button><button class="btn orange" data-act="deck">查看牌组</button><button class="btn gray" data-act="quit">回主菜单（保留完整存档）</button><button class="btn red sm" data-act="abandon">放弃本局</button></div>`)}
function statsHTML(){const st=S.stats;let most='—',mp=0;for(const k in S.levels)if(S.levels[k].p>mp){mp=S.levels[k].p;most=HANDS[k].n+'（'+mp+' 次）'}

  S.phase='over';SFX.lose();if(S.ante>REC.bestAnte){REC.bestAnte=S.ante;saveRec()}localStorage.removeItem('nj_save');renderAll();
  modal(`<h2 class="red-t">游戏结束</h2><div style="text-align:center;margin-bottom:10px">倒在了「${blindName()}」— 得分 ${fmt(S.score)} / ${fmt(blindTarget())}</div>${statsHTML()}<div class="row"><button class="btn blue big" data-act="newgame">再来一局</button><button class="btn gray" data-act="menu">主菜单</button></div>`);

/* ================= 标签（跳过奖励） ================= */
function applyTag(k){
  const t=TAGS[k];popAt($('#sbMoney'),t.n,'pw');SFX.magic();
  if(k==='coin')addMoney(8);
  else if(k==='rjoker'){if(!addJoker(randJoker('u')))addMoney(6);renderJokers()}
  else if(k==='reroll')S.freeRerolls+=2;
  else if(k==='invest')S.invest+=15;
  else if(k==='star'){openPack({t:'planet',n:'星图大包（免费）',size:5,cost:0},'blind');return true}
  else if(k==='arcana'){openPack({t:'tarot',n:'秘仪大包（免费）',size:5,cost:0},'blind');return true}
  return false;
}

const ACT={
  devicehelp:()=>deviceHelp(),savefiles:()=>saveFilesMenu(),export:()=>exportSave(),testsound:()=>testSound(),
  play:()=>playHand(),discard:()=>discard(),
  sortr:()=>{S.sortMode='rank';sortHand();renderHand();SFX.click();save()},sorts:()=>{S.sortMode='suit';sortHand();renderHand();SFX.click();save()},
  selblind:()=>{if(busy)return;SFX.click();startRound()},

document.addEventListener('click',e=>{
